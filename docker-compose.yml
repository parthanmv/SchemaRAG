services:
  postgres:
    image: postgres:18-alpine
    container_name: schemarag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-college_db}
      POSTGRES_USER: ${DB_USER:-schemarag}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_strongly}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - schemarag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  schemarag_pgdata:
